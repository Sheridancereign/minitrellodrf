[tool.poetry]
name = "minitrello"
version = "0.1.0"
description = ""
authors = ["Sheridan <Sheridancerein@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
django = "^6.0.5"
djangorestframework = "^3.17.1"
psycopg2-binary = "^2.9.12"
djangorestframework-simplejwt = "^5.5.1"
pydantic = "^2.0"
drf-spectacular = "^0.29.0"
pygments = "^2.20.0"
djangorestframework-stubs = "^3.17.0"

[tool.poetry.group.dev.dependencies]
black = "^24.0.0"
ruff = "^0.3.0"
mypy = "^1.9.0"
pytest = "^8.0.0"
pytest-django = "^4.8.0"
pre-commit = "^4.6.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = ["*migrations*"]

[tool.ruff.lint]
select = ["E", "F", "I"]